<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">MutiaraConnect navigation and interface coverage</title>
  <desc id="desc">Five core functions and eight screens. Public notice and feedback journeys are implemented. The separate staff dashboard is a design proposal; its response connection to public tracking is planned.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse"><path d="M0 0L0 6L8 3Z" fill="#116b70"/></marker><marker id="planned" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#9b6428"/></marker></defs>
  <rect width="1200" height="670" rx="14" fill="#fff"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#152b3a">
    <text x="32" y="44" font-size="22" font-weight="700">From public information to a visible response</text><text x="32" y="72" font-size="13" fill="#607482">Shared navigation links Home, Announcements, Impact Map, Submit Feedback and Track Feedback.</text>
    <rect x="235" y="107" width="710" height="175" rx="16" fill="#f2f8f8"/><text x="255" y="134" font-size="11" fill="#116b70" font-weight="700" letter-spacing="1">PUBLIC INFORMATION JOURNEY</text>
    <rect x="235" y="347" width="710" height="190" rx="16" fill="#f4f7fa"/><text x="255" y="374" font-size="11" fill="#116b70" font-weight="700" letter-spacing="1">COMMUNITY FEEDBACK JOURNEY</text>
    <g fill="none" stroke="#116b70" stroke-width="2" marker-end="url(#arrow)"><path d="M193 285H213V205H260"/><path d="M193 285H213V444H260"/><path d="M440 205H490"/><path d="M675 194H725"/><path d="M725 222H675"/><path d="M440 444H490"/><path d="M675 444H725"/></g>
    <g><rect x="30" y="241" width="163" height="88" rx="12" fill="#116b70"/><text x="48" y="264" font-size="11" fill="#bce5de">01 · ENTRY POINT</text><text x="48" y="290" font-size="17" font-weight="700" fill="#fff">Community</text><text x="48" y="313" font-size="17" font-weight="700" fill="#fff">home</text></g>
    <g fill="#fff" stroke="#bed5d9"><rect x="260" y="163" width="180" height="84" rx="11"/><rect x="490" y="163" width="185" height="84" rx="11"/><rect x="725" y="163" width="193" height="84" rx="11"/><rect x="260" y="402" width="180" height="84" rx="11"/><rect x="490" y="402" width="185" height="84" rx="11"/><rect x="725" y="402" width="193" height="84" rx="11"/></g>
    <g font-size="11" fill="#607482"><text x="277" y="188">02 · F1</text><text x="507" y="188">03 · F1</text><text x="742" y="188">04 · F2</text><text x="277" y="427">05 · F3</text><text x="507" y="427">06 · F3 → F4</text><text x="742" y="427">07 · F4</text></g>
    <g font-size="16" font-weight="700"><text x="277" y="218">Announcement list</text><text x="507" y="218">Notice detail</text><text x="742" y="218">Impact map</text><text x="277" y="457">Submit concern</text><text x="507" y="457">Reference receipt</text><text x="742" y="457">Feedback tracking</text></g>
    <text x="495" y="267" font-size="11" fill="#607482">Notice selection is preserved between detail and map.</text><text x="495" y="516" font-size="11" fill="#607482">The reference carries the submitted report into tracking.</text>
    <path d="M1038 367V444H927" fill="none" stroke="#9b6428" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#planned)"/>
    <rect x="974" y="251" width="195" height="115" rx="12" fill="#fff7e9" stroke="#d7b782" stroke-dasharray="6 4"/><text x="990" y="279" font-size="11" fill="#855118">08 · F5 · DESIGN ONLY</text><text x="990" y="307" font-size="17" font-weight="700">Staff dashboard</text><text x="990" y="332" font-size="11" fill="#855118">Review queue · Preview reply</text><text x="989" y="389" font-size="10" fill="#855118">Planned integration</text>
    <rect x="30" y="580" width="1139" height="60" rx="10" fill="#f5f8f9"/><path d="M52 610H90" stroke="#116b70" stroke-width="2" marker-end="url(#arrow)"/><text x="102" y="614" font-size="12">Implemented page flow</text><path d="M345 610H383" stroke="#9b6428" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#planned)"/><text x="396" y="614" font-size="12">Proposed staff-to-public update</text><text x="730" y="614" font-size="12" fill="#607482">UI navigation design · Not a UML user diagram</text>
  </g>
