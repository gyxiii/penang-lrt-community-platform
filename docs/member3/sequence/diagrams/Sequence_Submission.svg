<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1235" viewBox="0 0 1280 1235" role="img" aria-labelledby="title desc">
<title id="title">Submit feedback</title>
<desc id="desc">UML sequence diagram. Time flows downward. Dashed lifelines, solid calls, dashed replies and guarded interaction fragments. Browser storage is localStorage, not a remote database.</desc>
